name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.25.0'

    - name: Install and run golangci-lint
      uses: golangci/golangci-lint-action@v3
      with:
        version: v1.59.1
        working-directory: server

    - name: Run tests
      run: make test