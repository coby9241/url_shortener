<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Shortener</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
            padding: 30px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #555;
        }

        input[type="url"] {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }

        input[type="url"]:focus {
            outline: none;
            border-color: #007bff;
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease;
            width: 100%;
        }

        button:hover {
            background-color: #0056b3;
        }

        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        .result {
            margin-top: 25px;
            padding: 20px;
            background-color: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #007bff;
            display: none;
        }

        .result h3 {
            margin-top: 0;
            margin-bottom: 15px;
            color: #333;
        }

        .short-url-display {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 15px;
        }

        .short-url {
            flex-grow: 1;
            background-color: white;
            padding: 10px 12px;
            border-radius: 6px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 18px;
            letter-spacing: 1px;
            color: #007bff;
            word-break: break-all;
            border: 1px solid #eee;
        }

        .copy-btn {
            background-color: #28a745;
            padding: 8px 16px;
            font-size: 14px;
        }

        .copy-btn:hover {
            background-color: #218838;
        }

        .copy-btn:disabled {
            background-color: #ccc;
        }

        .error-message {
            color: #dc3545;
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            border-radius: 6px;
            padding: 12px 16px;
            margin-top: 15px;
            display: none;
        }

        .success-message {
            color: #28a745;
            background-color: #d4edda;
            border: 1px solid #c3e6cb;
            border-radius: 6px;
            padding: 12px 16px;
            margin-top: 15px;
            display: none;
        }

        @media (max-width: 480px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 24px;
                margin-bottom: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>URL Shortener</h1>

        <form id="urlForm">
            <div class="form-group">
                <label for="longUrl">Enter your long URL:</label>
                <input type="url" id="longUrl" placeholder="https://example.com/very/long/url/that/needs/to/be/shortened" required>
            </div>
            <button type="submit" id="submitBtn">Shorten URL</button>
        </form>

        <div id="errorMsg" class="error-message"></div>

        <div id="result" class="result">
            <h3>Your shortened URL:</h3>
            <div class="short-url-display">
                <div class="short-url" id="shortUrl"></div>
                <button type="button" class="copy-btn" id="copyBtn">Copy</button>
            </div>
            <div id="successMsg" class="success-message">URL copied to clipboard!</div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('urlForm');
            const longUrlInput = document.getElementById('longUrl');
            const submitBtn = document.getElementById('submitBtn');
            const resultDiv = document.getElementById('result');
            const shortUrlDisplay = document.getElementById('shortUrl');
            const copyBtn = document.getElementById('copyBtn');
            const errorMsg = document.getElementById('errorMsg');
            const successMsg = document.getElementById('successMsg');

            // Function to validate URL
            function validateURL(url) {
                try {
                    new URL(url);
                    return true;
                } catch (e) {
                    return false;
                }
            }

            // Function to generate a short code (mock implementation)
            function generateShortCode() {
                // Generate a random 6-character string using base62-like characters
                const chars = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
                let shortCode = '';
                for (let i = 0; i < 6; i++) {
                    shortCode += chars.charAt(Math.floor(Math.random() * chars.length));
                }
                return shortCode;
            }

            // Function to copy text to clipboard
            function copyToClipboard(text) {
                return navigator.clipboard.writeText(text);
            }

            // Handle form submission
            form.addEventListener('submit', function(e) {
                e.preventDefault();

                // Reset UI
                errorMsg.style.display = 'none';
                successMsg.style.display = 'none';
                resultDiv.style.display = 'none';
                shortUrlDisplay.textContent = '';

                const longUrl = longUrlInput.value.trim();

                // Validate input
                if (!longUrl) {
                    showError('Please enter a URL');
                    return;
                }

                if (!validateURL(longUrl)) {
                    showError('Please enter a valid URL');
                    return;
                }

                // Disable button and show loading state
                submitBtn.disabled = true;
                submitBtn.textContent = 'Shortening...';

                // Simulate API delay
                setTimeout(() => {
                    // Generate short code
                    const shortCode = generateShortCode();
                    const shortUrl = `https://short.ly/${shortCode}`;

                    // Display result
                    shortUrlDisplay.textContent = shortUrl;
                    resultDiv.style.display = 'block';

                    // Reset button
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Shorten URL';
                }, 1000);
            });

            // Handle copy button click
            copyBtn.addEventListener('click', function() {
                const shortUrl = shortUrlDisplay.textContent;
                if (shortUrl) {
                    copyToClipboard(shortUrl).then(() => {
                        // Show success message
                        successMsg.style.display = 'block';

                        // Hide success message after 2 seconds
                        setTimeout(() => {
                            successMsg.style.display = 'none';
                        }, 2000);
                    }).catch(err => {
                        showError('Failed to copy to clipboard');
                    });
                }
            });

            // Helper function to show error message
            function showError(message) {
                errorMsg.textContent = message;
                errorMsg.style.display = 'block';
            }

            // Enable Enter key to submit form
            longUrlInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    form.submit();
                }
            });
        });
    </script>
</body>
</html>
